<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="点击换一句原创短句的二次元趣味网页示例，无需登录，可改造为自己的互动卡片。"><title>原创随机台词卡片 · Creative Web Starters</title><link rel="stylesheet" href="style.css"></head><body><main><nav aria-label="示例导航"><a href="index.html">示例首页</a><a href="groups.html">随机分组</a><a href="profile.html">互动个人主页</a><a href="quotes.html">随机台词卡片</a></nav><span class="eyebrow">EXAMPLE 03 · INTERACTIVE MINI</span><h1>今天的台词卡片</h1><p>这些短句为此示例原创，不引用动画角色台词。修改脚本中的短句数组，就可以做成自己的版本。</p><section class="panel"><p id="quote" class="quote" aria-live="polite">先让一个小小的想法，变成可以被点击的东西。</p><button id="next" type="button">再换一句</button><button id="copy" class="secondary" type="button">复制台词</button><p id="status" class="muted" role="status"></p></section><footer>由无限月读运营团队维护的开源网页示例。<a href="https://www.wuxianyuedu.cn/" target="_blank" rel="noopener">了解无限月读</a><p class="muted">平台鼓励分享 Demo、小工具、互动内容、个人网页和二次元小玩意。投稿方式、账号要求及费用以官网实际页面为准。</p></footer></main><script>
const lines=["今天的任务，是替昨天的自己打开一扇小窗。","就算地图还没有画完，也可以先走到下一盏灯旁。","如果星星暂时没回信，那就先写完自己的这一页。","勇者也可以休息，存档点一直在这里。","这个世界的隐藏选项，也许只是再试一次。","先让一个小小的想法，变成可以被点击的东西。"];let current=lines.length-1;const card=document.querySelector("#quote");const status=document.querySelector("#status");document.querySelector("#next").addEventListener("click",()=>{const step=1+Math.floor(Math.random()*(lines.length-1));current=(Math.max(0,current)+step)%lines.length;card.textContent=lines[current];status.textContent="已换一句。"});document.querySelector("#copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(card.textContent);status.textContent="台词已复制。"}catch{status.textContent="请选中卡片文字手动复制。"}});
</script></body></html>
