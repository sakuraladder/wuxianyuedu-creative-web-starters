<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="本地运行的网页随机分组工具，每行输入一名参与者，自定义组数并复制分组结果。"><title>随机分组工具 · Creative Web Starters</title><link rel="stylesheet" href="style.css"></head><body><main><nav aria-label="示例导航"><a href="index.html">示例首页</a><a href="groups.html">随机分组</a><a href="profile.html">互动个人主页</a><a href="quotes.html">随机台词卡片</a></nav><span class="eyebrow">EXAMPLE 01 · WEB TOOL</span><h1>活动随机分组</h1><p>每行输入一名参与者。数据只在当前页面处理，不会发送到服务器；刷新后恢复示例名单。</p><section class="panel"><form><label for="names">参与者名单<textarea id="names" rows="7">海棠
墨雨
千夏
白露
林间
星野</textarea></label><label for="count">分成几组<input id="count" type="number" min="1" max="1000" value="2" required></label><button type="submit">随机分组</button><button id="copy" class="secondary" type="button" disabled>复制结果</button></form><p id="status" class="error" role="status" aria-live="polite"></p><pre id="result" class="result" hidden></pre></section><details><summary>示例限制</summary><p>这是普通活动的随机分组示例，不提供服务器存档、多人同步或审计记录。同名条目按不同参与者处理。</p></details><footer>由无限月读运营团队维护的开源网页示例。<a href="https://www.wuxianyuedu.cn/" target="_blank" rel="noopener">了解无限月读</a><p class="muted">平台鼓励分享 Demo、小工具、互动内容、个人网页和二次元小玩意。投稿方式、账号要求及费用以官网实际页面为准。</p></footer></main><script>
const form=document.querySelector("form");const output=document.querySelector("#result");const status=document.querySelector("#status");function randomInt(max){const limit=Math.floor(4294967296/max)*max;const buffer=new Uint32Array(1);let value;do{crypto.getRandomValues(buffer);value=buffer[0]}while(value>=limit);return value%max}form.addEventListener("submit",event=>{event.preventDefault();const names=document.querySelector("#names").value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean);const count=Number(document.querySelector("#count").value);if(names.length<2||names.length>1000||!Number.isInteger(count)||count<1||count>names.length){output.hidden=true;document.querySelector("#copy").disabled=true;status.textContent="请输入 2 至 1000 名参与者，组数须为 1 到参与者人数之间的整数。";return}for(let i=names.length-1;i>0;i--){const j=randomInt(i+1);[names[i],names[j]]=[names[j],names[i]]}const groups=Array.from({length:count},()=>[]);names.forEach((name,index)=>groups[index%count].push(name));output.textContent=groups.map((group,index)=>"第 "+(index+1)+" 组："+group.join("、")).join("\n");output.hidden=false;document.querySelector("#copy").disabled=false;status.textContent="已完成随机分组，各组人数最多相差一人。"});document.querySelector("#copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(output.textContent);status.textContent="结果已复制。"}catch{status.textContent="当前浏览器未允许自动复制，请选中下方结果手动复制。"}});
</script></body></html>
